name: Deploy Valheim

# Applies ONLY after code lands on main/master (a merged PR or a direct
# push). Pull requests get a read-only plan from plan-valheim.yml instead.
on:
  push:
    branches: [main, master]
    paths:
      - "stacks/shared/**"
      - "stacks/servers/**"
      - "modules/**"
      - "trigger-service/**"
      - "terramate.tm.hcl"
      - ".github/**"
  workflow_dispatch: # re-deploys every stack; only allowed from main/master

# Merges deploy one at a time, in order.
concurrency:
  group: deploy-valheim-my-user-project-308320
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # keyless Workload Identity Federation auth

env:
  PROJECT_ID: my-user-project-308320
  REGION: us-central1
  DEPLOYER_SA: github-deployer@my-user-project-308320.iam.gserviceaccount.com
  TF_STATE_BUCKET: my-user-project-308320-valheim-tfstate
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Build, plan and apply
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      TF_VAR_server_passwords: ${{ secrets.VALHEIM_SERVER_PASSWORDS }}
      TF_VAR_trigger_invoker_members: ${{ vars.TRIGGER_INVOKER_MEMBERS || '[]' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required settings
        run: bash .github/scripts/check-settings.sh

      - name: Select stacks
        id: select
        # Manual runs re-deploy everything; pushes deploy what changed.
        run: bash .github/scripts/select-stacks.sh "${{ github.event_name == 'push' && github.event.before || '' }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push trigger-service image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/valheim/trigger-service:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" trigger-service
          docker push "$IMAGE"
          echo "TF_VAR_trigger_image=$IMAGE" >> "$GITHUB_ENV"

      - uses: terramate-io/terramate-action@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate Terramate code
        run: terramate generate

      - name: Terraform apply (per stack, shared first)
        run: |
          terramate list ${{ steps.select.outputs.flags }}
          terramate run ${{ steps.select.outputs.flags }} \
            --disable-check-git-untracked --disable-check-git-uncommitted \
            -- bash "$GITHUB_WORKSPACE/.github/scripts/stack.sh" apply
