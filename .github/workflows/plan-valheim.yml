name: Plan Valheim

# Read-only preview for pull requests. Nothing is pushed or applied here -
# deploys happen in deploy-valheim.yml after the PR is merged.
on:
  pull_request:
    branches: [main, master]
    paths:
      - "stacks/valheim/**"
      - "trigger-service/**"
      - "terramate.tm.hcl"
      - ".github/workflows/plan-valheim.yml"
      - ".github/workflows/deploy-valheim.yml"

concurrency:
  group: plan-valheim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write      # keyless auth as the read-only planner account
  pull-requests: write # post the plan as a PR comment

env:
  PROJECT_ID: my-user-project-308320
  REGION: us-central1
  PLANNER_SA: github-planner@my-user-project-308320.iam.gserviceaccount.com
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Build check and plan
    runs-on: ubuntu-latest

    env:
      TF_VAR_project_id: my-user-project-308320
      TF_VAR_region: us-central1
      TF_VAR_zone: us-central1-a
      TF_VAR_server_password: ${{ secrets.VALHEIM_SERVER_PASSWORD }}
      TF_VAR_trigger_invoker_members: ${{ vars.TRIGGER_INVOKER_MEMBERS || '[]' }}
      # The image deploy-valheim.yml would push; used only so the plan shows
      # the Cloud Run change. (After merge the tag is the merge commit SHA.)
      TF_VAR_trigger_image: us-central1-docker.pkg.dev/my-user-project-308320/valheim/trigger-service:${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Check required settings
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          missing=0
          [ -n "$WIF_PROVIDER" ] || { echo "::error::Repository variable GCP_WIF_PROVIDER is not set (bootstrap output github_wif_provider)."; missing=1; }
          [ -n "$TF_VAR_server_password" ] || { echo "::error::Secret VALHEIM_SERVER_PASSWORD is not set."; missing=1; }
          exit $missing

      - name: Build trigger-service image (no push)
        run: docker build -t trigger-service:pr trigger-service

      - name: Authenticate to Google Cloud (read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.PLANNER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: terramate-io/terramate-action@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate Terramate code
        run: terramate generate

      - name: Terraform init
        id: init
        working-directory: stacks/valheim
        # Creating a brand-new state file needs write access, which the
        # read-only planner doesn't have. Until the first deploy from
        # main/master has created it, plan against an empty local state
        # instead - that is exactly what the first deploy will start from.
        run: |
          STATE="gs://my-user-project-308320-valheim-tfstate/valheim/default.tfstate"
          if out=$(gcloud storage ls "$STATE" 2>&1); then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "matched no objects"; then
            echo "::notice::No deployed state yet - planning against empty state. The first merge to main/master will create everything shown."
            rm -f _generated_backend.tf
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check for remote state: $out"
            exit 1
          fi
          terraform init -input=false

      - name: Terraform validate
        working-directory: stacks/valheim
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: stacks/valheim
        # -lock=false: the planner can't write the state lock, and a plan
        # never changes state anyway.
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Terraform plan (not applied)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('stacks/valheim/plan.txt', 'utf8');
            if (plan.length > 60000) plan = '...(truncated)...\n' + plan.slice(-60000);
            const marker = '<!-- valheim-plan -->';
            const fresh = '${{ steps.init.outputs.fresh }}' === 'true';
            const body = `${marker}\n### Terraform plan for \`my-user-project-308320\`\n` +
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)} - **not applied**; deploys after merge.\n` +
              (fresh ? '> Nothing has been deployed yet, so this is planned against empty state.\n' : '') + '\n' +
              '<details><summary>Show plan</summary>\n\n```\n' + plan + '\n```\n</details>';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
