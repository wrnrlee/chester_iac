name: Plan Valheim

# Read-only preview for pull requests. Nothing is pushed or applied here -
# deploys happen in deploy-valheim.yml after the PR is merged.
on:
  pull_request:
    branches: [main, master]
    paths:
      - "stacks/shared/**"
      - "stacks/servers/**"
      - "modules/**"
      - "trigger-service/**"
      - "terramate.tm.hcl"
      - ".github/**"

concurrency:
  group: plan-valheim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write      # keyless auth as the read-only planner account
  pull-requests: write # post the plan as a PR comment

env:
  PROJECT_ID: my-user-project-308320
  REGION: us-central1
  PLANNER_SA: github-planner@my-user-project-308320.iam.gserviceaccount.com
  TF_STATE_BUCKET: my-user-project-308320-valheim-tfstate
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Build check and plan
    runs-on: ubuntu-latest

    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      TF_VAR_server_passwords: ${{ secrets.VALHEIM_SERVER_PASSWORDS }}
      TF_VAR_trigger_invoker_members: ${{ vars.TRIGGER_INVOKER_MEMBERS || '[]' }}
      # The tag deploy-valheim.yml would push; only used so the plan shows
      # the Cloud Run change (after merge the tag is the merge commit SHA).
      TF_VAR_trigger_image: us-central1-docker.pkg.dev/my-user-project-308320/valheim/trigger-service:${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # change detection compares against the base branch

      - name: Check required settings
        run: bash .github/scripts/check-settings.sh

      - name: Select stacks
        id: select
        run: bash .github/scripts/select-stacks.sh "origin/${{ github.base_ref }}"

      - name: Build trigger-service image (no push)
        run: docker build -t trigger-service:pr trigger-service

      - name: Authenticate to Google Cloud (read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.PLANNER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: terramate-io/terramate-action@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate Terramate code
        run: terramate generate

      - name: Terraform plan (per stack)
        run: |
          terramate list ${{ steps.select.outputs.flags }}
          terramate run ${{ steps.select.outputs.flags }} \
            --disable-check-git-untracked --disable-check-git-uncommitted \
            -- bash "$GITHUB_WORKSPACE/.github/scripts/stack.sh" plan

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'plans';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.md')).sort() : [];
            let plans = files.map(f => fs.readFileSync(`${dir}/${f}`, 'utf8')).join('\n');
            if (!plans) plans = '_No Valheim stacks are affected by this change._';
            if (plans.length > 60000) plans = plans.slice(0, 60000) + '\n```\n...(truncated - see the run summary / logs)';
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Terraform plans (not applied)\n\n${plans}\n`);

            const marker = '<!-- valheim-plan -->';
            const body = `${marker}\n### Terraform plan for \`my-user-project-308320\`\n` +
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)} - **not applied**; deploys after merge.\n\n` +
              `<details><summary>Show plans (${files.length} stack${files.length === 1 ? '' : 's'})</summary>\n\n${plans}\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
